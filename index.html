<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121212">
    <title>Editor Cloud Pro</title>
    <style>
        :root { --bg: #f4f4f9; --txt: #1a1a1a; --ed-bg: #ffffff; --btn-main: #2563eb; --btn-sec: #333; --brd: #ccc; }
        [data-theme="dark"] { --bg: #000000; --txt: #e0e0e0; --ed-bg: #121212; --btn-main: #3b82f6; --btn-sec: #222; --brd: #333; }
        
        body {
            font-family: system-ui, sans-serif; margin: 0; padding: 12px;
            background-color: var(--bg); color: var(--txt);
            display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
            transition: 0.3s;
        }

        .menu { display: flex; gap: 8px; margin-bottom: 15px; justify-content: center; }
        
        button, .btn-file {
            width: 55px; height: 50px; border-radius: 12px; border: none;
            background: var(--btn-sec); color: white; font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .active { background: var(--btn-main); }
        input[type="file"] { display: none; }
        
        #editor {
            flex-grow: 1; width: 100%; padding: 15px;
            background-color: var(--ed-bg); color: var(--txt);
            border: 1px solid var(--brd); border-radius: 18px;
            font-family: 'Consolas', monospace; font-size: 16px;
            resize: none; box-sizing: border-box; outline: none;
            line-height: 1.6;
        }

        .info {
            display: flex; justify-content: space-between;
            font-size: 10px; margin-top: 8px; opacity: 0.5; padding: 0 10px;
        }
    </style>
</head>
<body>

    <div class="menu">
        <button onclick="location.reload()">+</button>
        <label class="btn-file" for="file-up">📁</label>
        <input type="file" id="file-up" accept=".txt,.html">
        
        <button class="active" onclick="askSave('.txt')">📄</button>
        <button class="active" onclick="askSave('.html')">&lt;&gt;</button>
        <button onclick="toggleTheme()">🌙</button>
    </div>

    <textarea id="editor" placeholder="Empieza a escribir..."></textarea>
    
    <div class="info">
        <span id="cloud-status">...</span>
        <span id="char-count">0</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCB0PFCfm5sL7ZYzqnvGUZmAx5eASQJLHg",
            authDomain: "simple-editor-tkworld.firebaseapp.com",
            databaseURL: "https://simple-editor-tkworld-default-rtdb.firebaseio.com",
            projectId: "simple-editor-tkworld",
            storageBucket: "simple-editor-tkworld.firebasestorage.app",
            messagingSenderId: "742201012043",
            appId: "1:742201012043:web:b298b9b968ce4fe863c2ce",
            measurementId: "G-P7K0PJQ5WT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const docRef = ref(db, 'escrito_compartido');
        
        const editor = document.getElementById('editor');
        const cloudStatus = document.getElementById('cloud-status');
        const charCount = document.getElementById('char-count');

        onValue(docRef, (snapshot) => {
            const content = snapshot.val();
            if (content !== null && document.activeElement !== editor) {
                editor.value = content;
                updateStats();
            }
            cloudStatus.innerText = "Sincronizado";
        });

        let timer;
        editor.addEventListener('input', () => {
            cloudStatus.innerText = "Escribiendo...";
            updateStats();
            clearTimeout(timer);
            timer = setTimeout(() => {
                set(docRef, editor.value)
                    .then(() => cloudStatus.innerText = "Guardado")
                    .catch(() => cloudStatus.innerText = "Error");
            }, 800);
        });

        function updateStats() {
            charCount.innerText = editor.value.length + " car.";
        }

        window.toggleTheme = () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        };

        // Abrir archivo local
        document.getElementById('file-up').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                editor.value = ev.target.result;
                set(docRef, editor.value);
            };
            reader.readAsText(file);
        });

        window.askSave = (ext) => {
            let name = prompt("Nombre del archivo:", "nota");
            if (!name) return;
            const blob = new Blob([editor.value], { type: "text/plain" });
            const a = document.createElement("a");
            a.download = name + ext;
            a.href = window.URL.createObjectURL(blob);
            a.click();
        };

        if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    </script>
</body>
</html>
